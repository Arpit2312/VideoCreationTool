name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Clone engine repositories (read-only references for adapter tests)
        run: |
          mkdir -p ~/.spacestudio/engines
          git clone --depth 1 https://github.com/OpenMontageInc/OpenMontage.git ~/.spacestudio/engines/OpenMontage
          git clone --depth 1 https://github.com/Moh4696/cinematic-skill.git ~/.spacestudio/engines/cinematic-skill
          git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git ~/.spacestudio/engines/lemo-opuscar
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Test backend
        working-directory: backend
        run: .venv/bin/pytest -q

  backend-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Clone engine repositories (read-only references for adapter tests)
        shell: bash
        run: |
          mkdir -p ~/.spacestudio/engines
          git clone --depth 1 https://github.com/OpenMontageInc/OpenMontage.git ~/.spacestudio/engines/OpenMontage
          git clone --depth 1 https://github.com/Moh4696/cinematic-skill.git ~/.spacestudio/engines/cinematic-skill
          git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git ~/.spacestudio/engines/lemo-opuscar
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e ".[dev]"
      - name: Test backend
        working-directory: backend
        run: .venv\Scripts\python -m pytest -q
      - name: Launcher (run.ps1) sets up from a clean checkout
        shell: powershell
        run: |
          Remove-Item -Recurse -Force backend\.venv
          powershell -ExecutionPolicy Bypass -File run.ps1 -SetupOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path backend\.venv\Scripts\spacestudio.exe)) { exit 1 }
          if (-not (Test-Path frontend\dist\index.html)) { exit 1 }

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
