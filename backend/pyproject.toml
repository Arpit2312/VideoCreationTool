[project]
name = "spacestudio"
version = "0.1.0"
description = "SpaceStudio: a unified AI video production studio orchestrated by Claude Code"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[project.scripts]
spacestudio = "spacestudio.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spacestudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
